<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>模拟天气</title>
    <style>
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body {
        margin: 0;
        padding: 20px;
        font-family: system-ui, "Microsoft YaHei", sans-serif;
        color: #172b4d;
        background: #f5f8ff;
      }
      main { max-width: 640px; margin: 0 auto; }
      header, form, .temperature-row { display: flex; align-items: center; gap: 12px; }
      header { justify-content: space-between; margin-bottom: 20px; }
      h1 { margin: 0; font-size: 20px; }
      .badge { padding: 5px 10px; border-radius: 20px; background: #dfeaff; color: #2453a6; font-size: 12px; }
      form { flex-wrap: wrap; margin-bottom: 16px; }
      label { font-size: 14px; }
      select, button { min-height: 40px; padding: 8px 14px; border-radius: 10px; font: inherit; }
      select { flex: 1; color: inherit; background: #fff; border: 1px solid #c5d3e8; }
      button { border: 0; background: #245edb; color: #fff; cursor: pointer; }
      button:disabled { opacity: .5; cursor: wait; }
      :focus-visible { outline: 3px solid #f0a329; outline-offset: 3px; }
      .weather-card { overflow: hidden; border: 1px solid #d7e3f4; border-radius: 20px; background: #fff; }
      .hero { padding: 26px; color: #fff; background: linear-gradient(125deg, #193d83, #2477bc); }
      h2 { margin: 0 0 6px; font-size: 24px; }
      .condition { margin: 0; color: #e0efff; }
      .temperature-row { justify-content: space-between; margin: 14px 0; }
      .temperature { font-size: 64px; line-height: 1.2; font-weight: 650; letter-spacing: -3px; }
      .weather-icon { font-size: 56px; }
      .range { margin: 0; font-size: 14px; color: #e0efff; }
      dl { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin: 0; padding: 22px; }
      dt { margin-bottom: 8px; color: #5a6d88; font-size: 13px; }
      dd { margin: 0; font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
      .note, #status { font-size: 13px; line-height: 1.6; color: #5a6d88; }
      #status:empty { display: none; }
      #status[data-error="true"] { color: #b62b39; }
      .note { margin-bottom: 0; }
      @media (max-width: 380px) {
        body { padding: 12px; }
        dl { grid-template-columns: 1fr; gap: 14px; }
        .temperature { font-size: 52px; }
        .hero { padding: 20px; }
      }
      @media (prefers-color-scheme: dark) {
        body { color: #e7eefc; background: #141e30; }
        select, .weather-card { color: #e7eefc; background: #1b2940; border-color: #384b68; }
        dt, .note, #status { color: #b6c5dd; }
        .badge { color: #d3e2ff; background: #2b4268; }
        #status[data-error="true"] { color: #ff9fa8; }
      }
    </style>
  </head>
  <body>
    <main>
      <header><h1>城市天气</h1><span class="badge">MOCK · 模拟数据</span></header>
      <form id="weather-form">
        <label for="city-select">城市</label>
        <select id="city-select" name="city">
          <option>北京</option><option>上海</option><option>广州</option><option>深圳</option><option>杭州</option>
        </select>
        <button id="query-button" type="submit" disabled>查询天气</button>
      </form>
      <p id="status" role="status" aria-live="polite">正在连接天气卡片…</p>
      <article id="weather-card" class="weather-card" aria-label="模拟天气详情" hidden>
        <div class="hero">
          <h2 id="city-name"></h2>
          <p id="condition" class="condition"></p>
          <div class="temperature-row">
            <span id="temperature" class="temperature"></span>
            <span id="weather-icon" class="weather-icon" aria-hidden="true"></span>
          </div>
          <p id="range" class="range"></p>
        </div>
        <dl>
          <div><dt>体感温度</dt><dd id="feels-like"></dd></div>
          <div><dt>相对湿度</dt><dd id="humidity"></dd></div>
          <div><dt>风况</dt><dd id="wind"></dd></div>
        </dl>
      </article>
      <p class="note">所有天气均为固定 Mock 数据，仅用于功能演示，不代表实时天气。</p>
      <noscript>需要启用 JavaScript，并在支持 MCP Apps 的客户端中查看天气卡片。</noscript>
    </main>
    <script type="module">
      /* __WEATHER_APP_SDK__ */
      const { App } = WeatherAppSDK;
      const WEATHER_TOOL = "get_weather_app";
      const citySelect = document.getElementById("city-select");
      const queryButton = document.getElementById("query-button");
      const weatherCard = document.getElementById("weather-card");
      const statusElement = document.getElementById("status");
      const weatherIcons = { "晴": "☀️", "多云": "☁️", "阵雨": "🌦️", "晴间多云": "🌤️", "小雨": "🌧️" };
      let app;

      function setStatus(message, isError = false) {
        statusElement.textContent = message;
        statusElement.dataset.error = String(isError);
      }

      function showError(message) {
        weatherCard.hidden = true;
        setStatus(message, true);
      }

      function renderWeather(weather) {
        const fields = {
          "city-name": weather.city,
          "condition": weather.condition,
          "temperature": `${weather.temperature_c}°`,
          "range": `最低 ${weather.low_c}°C / 最高 ${weather.high_c}°C`,
          "feels-like": `${weather.feels_like_c}°C`,
          "humidity": `${weather.humidity_percent}%`,
          "wind": weather.wind,
          "weather-icon": weatherIcons[weather.condition] ?? "🌡️",
        };
        Object.entries(fields).forEach(([id, value]) => {
          document.getElementById(id).textContent = value;
        });
        citySelect.value = weather.city;
        weatherCard.hidden = false;
        setStatus("");
      }

      function handleToolResult(result) {
        if (result.isError) {
          const error = result.content?.find((item) => item.type === "text");
          showError(error?.text ?? "天气查询失败，请重试。");
          return;
        }
        const weather = result.structuredContent;
        if (!weather || weather.is_mock !== true || typeof weather.city !== "string") {
          showError("未收到有效的 Mock 天气数据，请重新查询。");
          return;
        }
        renderWeather(weather);
      }

      async function queryWeather(event) {
        event.preventDefault();
        queryButton.disabled = true;
        setStatus("正在查询模拟天气…");
        try {
          const result = await app.callServerTool({
            name: WEATHER_TOOL,
            arguments: { city: citySelect.value },
          });
          handleToolResult(result);
        } catch (error) {
          showError(`查询失败：${error.message}`);
        } finally {
          queryButton.disabled = false;
        }
      }

      async function connectApp() {
        if (window.parent === window) {
          setStatus("请在支持 MCP Apps 的客户端中调用 get_weather_app 查看天气卡片。");
          return;
        }
        try {
          app = new App({ name: "Mock Weather", version: "1.0.0" }, {});
          app.ontoolresult = handleToolResult;
          app.ontoolcancelled = () => showError("天气查询已取消。");
          app.onerror = (error) => showError(`卡片通信失败：${error.message}`);
          document.getElementById("weather-form").addEventListener("submit", queryWeather);
          await app.connect();
          queryButton.disabled = false;
          if (weatherCard.hidden) {
            setStatus("已连接，等待天气数据；也可以选择城市查询。");
          }
        } catch (error) {
          showError(`卡片连接失败，请检查客户端的 MCP Apps 支持：${error.message}`);
        }
      }

      void connectApp();
    </script>
  </body>
</html>
