<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">Batch 02 web checkout screen with Chinese punctuation</title>
  <desc id="description">Desktop checkout fixture with readable Simplified Chinese, full-width punctuation, currency, and identifiers.</desc>
  <rect width="1280" height="720" fill="#ffedd5"/>
  <rect x="48" y="32" width="1184" height="656" rx="24" fill="#ffffff" stroke="#c2410c" stroke-width="5"/>
  <path d="M48 103h1184" stroke="#fed7aa" stroke-width="4"/>
  <circle cx="86" cy="68" r="10" fill="#ef4444"/>
  <circle cx="120" cy="68" r="10" fill="#f59e0b"/>
  <circle cx="154" cy="68" r="10" fill="#22c55e"/>
  <rect x="210" y="50" width="720" height="36" rx="18" fill="#fff7ed"/>
  <text x="234" y="75" font-family="Arial, sans-serif" font-size="20" fill="#7c2d12">https://example.test/zh-CN/checkout</text>
  <rect x="82" y="126" width="368" height="49" rx="24" fill="#c2410c"/>
  <text x="266" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">BATCH 02 · WEB · CHECKOUT</text>
  <text x="122" y="259" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="50" font-weight="700" fill="#7c2d12">确认付款：订单 #A-2048</text>
  <rect x="122" y="302" width="642" height="197" rx="20" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
  <text x="157" y="357" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="30" fill="#9a3412">商品：旅行收纳包 × 2</text>
  <text x="157" y="414" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="30" fill="#9a3412">总计：¥128.00</text>
  <text x="157" y="471" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="27" fill="#9a3412">保存地址？ 是 / 否</text>
  <rect x="830" y="298" width="320" height="89" rx="18" fill="#c2410c"/>
  <text x="990" y="354" text-anchor="middle" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="34" font-weight="700" fill="#ffffff">“立即支付”</text>
  <rect x="830" y="414" width="320" height="72" rx="18" fill="#ffedd5" stroke="#c2410c" stroke-width="3"/>
