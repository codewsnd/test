  <text x="122" y="593" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="27" fill="#7c2d12">提示：付款后不可撤销。</text>
  <text x="122" y="639" font-family="Arial, sans-serif" font-size="21" fill="#64748b">Chinese OCR fixture · colon / quotes / question mark / multiplication sign</text>
