<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">Round two web receipt history screen for multiple-dot filename validation</title>
  <desc id="description">Desktop fixture with a multi-dot filename, payment copy, currency, and exact punctuation.</desc>
  <rect width="1280" height="720" fill="#fef3c7"/>
  <rect x="50" y="34" width="1180" height="652" rx="24" fill="#ffffff" stroke="#b45309" stroke-width="5"/>
  <path d="M50 104h1180" stroke="#fde68a" stroke-width="4"/>
  <circle cx="88" cy="69" r="10" fill="#ef4444"/>
  <circle cx="122" cy="69" r="10" fill="#f59e0b"/>
  <circle cx="156" cy="69" r="10" fill="#22c55e"/>
  <rect x="214" y="51" width="710" height="36" rx="18" fill="#fffbeb"/>
  <text x="238" y="76" font-family="Arial, sans-serif" font-size="20" fill="#78350f">https://example.test/orders/B-4096/receipt</text>
  <rect x="84" y="126" width="404" height="49" rx="24" fill="#b45309"/>
  <text x="286" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">ROUND 2 · WEB · RECEIPT</text>
  <text x="122" y="251" font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#78350f">Payment received.</text>
  <text x="122" y="304" font-family="Arial, sans-serif" font-size="27" fill="#92400e">Order #B-4096 · Total: $89.50</text>
  <rect x="122" y="348" width="739" height="183" rx="18" fill="#fffbeb" stroke="#f59e0b" stroke-width="3"/>
  <text x="158" y="405" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#78350f">Receipt details</text>
  <text x="158" y="455" font-family="Arial, sans-serif" font-size="26" fill="#92400e">Status: Paid</text>
  <text x="158" y="499" font-family="Arial, sans-serif" font-size="26" fill="#92400e">Country / Region: Singapore</text>
  <rect x="920" y="346" width="240" height="84" rx="18" fill="#b45309"/>
  <text x="1040" y="399" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">Download PDF</text>
  <rect x="920" y="454" width="240" height="72" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
  <text x="1040" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#78350f">View order</text>
  <text x="122" y="605" font-family="Arial, sans-serif" font-size="25" fill="#78350f">Need help? Contact support.</text>
  <text x="122" y="646" font-family="Arial, sans-serif" font-size="21" fill="#64748b">Filename fixture · spaces plus multiple dots</text>
</svg>
