<svg xmlns="http://www.w3.org/2000/svg" width="430" height="860" viewBox="0 0 430 860" role="img" aria-labelledby="title description">
  <title id="title">Round three mobile region confirmation screen for Chinese and spaced filename validation</title>
  <desc id="description">Mobile fixture that presents spaced and compact slash variants as distinct visible strings.</desc>
  <rect width="430" height="860" rx="46" fill="#064e3b"/>
  <rect x="13" y="13" width="404" height="834" rx="36" fill="#ecfdf5"/>
  <rect x="153" y="27" width="124" height="26" rx="13" fill="#064e3b"/>
  <text x="42" y="86" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#065f46">09:45</text>
  <rect x="35" y="114" width="360" height="50" rx="25" fill="#059669"/>
  <text x="215" y="147" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">ROUND 3 · MOBILE · REGION</text>
  <text x="39" y="236" xml:space="preserve" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="34" font-weight="700" fill="#064e3b">国家 / 地区</text>
  <text x="39" y="284" xml:space="preserve" font-family="'DejaVu Sans Mono', monospace" font-size="27" font-weight="700" fill="#065f46">Country/Region</text>
  <rect x="39" y="323" width="352" height="127" rx="17" fill="#ffffff" stroke="#10b981" stroke-width="4"/>
  <text x="63" y="371" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="25" fill="#065f46">已选择</text>
  <text x="63" y="417" xml:space="preserve" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="29" font-weight="700" fill="#064e3b">Singapore / 新加坡</text>
  <circle cx="215" cy="564" r="75" fill="#a7f3d0" stroke="#059669" stroke-width="5"/>
  <path d="M178 566l26 27 53-61" fill="none" stroke="#047857" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="215" y="686" text-anchor="middle" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="37" font-weight="700" fill="#064e3b">设置已保存。</text>
  <text x="215" y="739" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#065f46">Region updated successfully.</text>
  <rect x="155" y="817" width="120" height="6" rx="3" fill="#064e3b"/>
</svg>
