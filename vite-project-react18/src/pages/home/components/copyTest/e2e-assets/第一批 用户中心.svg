<svg xmlns="http://www.w3.org/2000/svg" width="430" height="860" viewBox="0 0 430 860" role="img" aria-labelledby="title description">
  <title id="title">Round one mobile profile screen for Chinese and spaced filename validation</title>
  <desc id="description">High-contrast mobile fixture with exact English punctuation and a Chinese filename.</desc>
  <rect width="430" height="860" rx="46" fill="#172554"/>
  <rect x="13" y="13" width="404" height="834" rx="36" fill="#eff6ff"/>
  <rect x="153" y="27" width="124" height="26" rx="13" fill="#172554"/>
  <text x="42" y="86" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1e3a8a">09:44</text>
  <rect x="38" y="114" width="354" height="50" rx="25" fill="#2563eb"/>
  <text x="215" y="147" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">ROUND 1 · MOBILE · PROFILE</text>
  <circle cx="215" cy="272" r="73" fill="#bfdbfe" stroke="#2563eb" stroke-width="5"/>
  <circle cx="215" cy="249" r="25" fill="#1d4ed8"/>
  <path d="M166 315c11-39 87-39 98 0" fill="#1d4ed8"/>
  <text x="215" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="41" font-weight="700" fill="#172554">Profile saved.</text>
  <text x="215" y="451" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#1e3a8a">Don’t forget: verify email.</text>
  <rect x="39" y="497" width="352" height="102" rx="18" fill="#ffffff" stroke="#60a5fa" stroke-width="3"/>
  <text x="65" y="540" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="24" fill="#1e3a8a">国家 / 地区</text>
  <text x="65" y="577" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="25" font-weight="700" fill="#172554">中国</text>
  <rect x="39" y="637" width="352" height="76" rx="18" fill="#2563eb"/>
  <text x="215" y="686" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff">View account</text>
  <text x="215" y="769" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#1e3a8a">All changes are ready.</text>
  <rect x="155" y="817" width="120" height="6" rx="3" fill="#172554"/>
</svg>
